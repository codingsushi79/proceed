name: Publish to GitHub Packages

# Publishes the library whenever you cut a GitHub Release, and lets you trigger it by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to publish to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test
        run: ./gradlew build

      - name: Publish
        run: ./gradlew publish
        env:
          # Provided automatically by Actions — GITHUB_REPOSITORY is "owner/name",
          # GITHUB_ACTOR is the triggering user, GITHUB_TOKEN has packages:write here.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
