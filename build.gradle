plugins {
    id 'java-library'
    // Publishes to the Maven Central Portal (central.sonatype.com), handling PGP signing and the
    // sources/javadoc jars Central requires. Consumers then need no authentication at all.
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

// NOTE: this is the Maven *groupId*, not the Java package (which stays `dev.proceed`). Central
// verifies you own this namespace via your GitHub account (io.github.<user>).
group = 'io.github.codingsushi79'
version = '0.1.0'
description = 'Procedurally generate Minecraft structures from .litematic files with relative connection points.'

def githubSlug = 'codingsushi79/proceed'

java {
    // Java 17 keeps the library usable by the widest range of modern Minecraft mods
    // (1.18+ toolchains) while still allowing records, sealed types and switch expressions.
    // Compiled with whatever JDK runs Gradle (>= 17), targeting 17 bytecode.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    // Sources & javadoc jars are added by the maven-publish plugin below (Central requires them).
}

repositories {
    mavenCentral()
}

javadoc {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Runnable, file-free demo that prints a generated layout as an ASCII map:
//   ./gradlew runDemo            (random seed)
//   ./gradlew runDemo --args=42  (fixed seed)
tasks.register('runDemo', JavaExec) {
    group = 'application'
    description = 'Generate a sample structure and print a top-down ASCII map.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.proceed.example.MazeDemo'
}

// The library is intentionally dependency-free so it drops cleanly into any mod loader
// (Forge / Fabric / NeoForge / Quilt) without pulling transitive baggage onto the classpath.

// ---- Publishing to Maven Central -----------------------------------------------------------
//
// Credentials and the signing key come from the environment / Gradle properties, so nothing
// secret is committed:
//
//   mavenCentralUsername / mavenCentralPassword    - a Central Portal user token
//   signingInMemoryKey / signingInMemoryKeyPassword - your ASCII-armored PGP private key + pass
//
// Locally, put them in ~/.gradle/gradle.properties; in CI they are wired from GitHub secrets via
// ORG_GRADLE_PROJECT_* env vars (see .github/workflows/publish.yml).
mavenPublishing {
    // Upload to the Central Portal and release automatically once validation passes.
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()

    coordinates(group.toString(), 'proceed', version.toString())

    pom {
        name = 'Proceed'
        description = project.description
        inceptionYear = '2026'
        url = "https://github.com/${githubSlug}"
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'codingsushi79'
                name = 'codingsushi79'
                url = 'https://github.com/codingsushi79'
            }
        }
        scm {
            url = "https://github.com/${githubSlug}"
            connection = "scm:git:https://github.com/${githubSlug}.git"
            developerConnection = "scm:git:ssh://git@github.com/${githubSlug}.git"
        }
    }
}
